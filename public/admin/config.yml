backend:
  name: github
  repo: Flighter13/aces-technology-next
  branch: migration/astro-cms
  site_domain: YOUR-NETLIFY-SITE.netlify.app

site_url: https://YOUR-NETLIFY-SITE.netlify.app/
media_folder: public/images
public_folder: /images
publish_mode: editorial_workflow

collections:
  - name: research
    label: Research Projects
    folder: src/content/research
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: Description, name: description, widget: text, required: true }
      - { label: Date, name: date, widget: datetime, required: true }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Status, name: status, widget: select, options: [Planning, Active, Completed], default: Active }
      - { label: Partner, name: partner, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: profiles
    label: Aircraft and Technology Profiles
    folder: src/content/profiles
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: Description, name: description, widget: text, required: true }
      - { label: Date, name: date, widget: datetime, required: true }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Category, name: category, widget: select, options: [Aircraft, Technology], default: Technology }
      - { label: Platform, name: platform, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: publications
    label: Publications and Reports
    folder: src/content/publications
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: Description, name: description, widget: text, required: true }
      - { label: Date, name: date, widget: datetime, required: true }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Publisher, name: publisher, widget: string, required: false }
      - { label: Link, name: link, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: presentations
    label: Presentations
    folder: src/content/presentations
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: Description, name: description, widget: text, required: true }
      - { label: Date, name: date, widget: datetime, required: true }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Venue, name: venue, widget: string, required: false }
      - { label: Link, name: link, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: news
    label: News and Updates
    folder: src/content/news
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: Description, name: description, widget: text, required: true }
      - { label: Date, name: date, widget: datetime, required: true }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Category, name: category, widget: select, options: [Project Update, News, Milestone], default: Project Update }
      - { label: Body, name: body, widget: markdown }

  - name: team
    label: Team and About
    folder: src/content/team
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: Description, name: description, widget: text, required: true }
      - { label: Role, name: role, widget: string, required: false }
      - { label: Email, name: email, widget: string, required: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown, required: false }
